plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.novastream.provider.api'
    compileSdk 36
    defaultConfig {
        minSdk 22
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':core-model')
}

/*
 * v15 target module :provider-api
 * Migrate here: StreamingProvider, ProviderResult, IptvStreamingProvider
 */
